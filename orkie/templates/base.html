<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Orkie{% endblock %}</title>
  <link rel="stylesheet" href="/static/dashboard.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="shell">
    <nav class="top">
      <a class="brand" href="/">Orkie</a>
      <div class="links">
        <a href="/agents">Agents</a>
        <a href="/issues">Issues</a>
      </div>
      {% if repo %}
      <span class="repo">{{ repo }}</span>
      {% endif %}
    </nav>
    {% if intake_error %}
    <p class="banner error">{{ intake_error }} (as of last failed poll)</p>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
