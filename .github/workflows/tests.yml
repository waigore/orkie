name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'orkie/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/workflows/tests.yml'

  unit:
    name: Unit tests and coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with test extras
        run: python -m pip install -e ".[dev]"

      - name: Run offline suite with coverage gate
        run: >
          pytest
          -m "not integration"
          --cov=orkie
          --cov-report=term-missing
          --cov-fail-under=80

  # Stable check name: succeeds when there is no code change, or when unit passed.
  result:
    name: Tests result
    needs: [changes, unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resolve outcome
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection failed."
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "No changes under orkie/, tests/, pyproject.toml, or this workflow; skipping tests."
            exit 0
          fi
          if [ "${{ needs.unit.result }}" = "success" ]; then
            echo "Unit tests passed."
            exit 0
          fi
          echo "Unit tests did not succeed (result=${{ needs.unit.result }})."
          exit 1
